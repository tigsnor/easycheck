name: easycheck
description: A mobile-first Flutter lab notebook for 96-well plate experiment planning, dilution calculation, and result management.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
